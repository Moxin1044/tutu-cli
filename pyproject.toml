[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutu-vuln-intel"
version = "0.1.0"
description = "tutu — 多源漏洞与威胁情报聚合搜索 CLI（NVD / CISA KEV / NSFOCUS / 微步 / 360 / 勒索软件情报等）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tutu contributors" }]
keywords = ["vulnerability", "threat-intelligence", "cve", "nvd", "kev", "ransomware", "osint", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "twine>=5"]

[project.scripts]
tutu = "tutu.cli:main"

[project.urls]
Homepage = "https://github.com/Moxin1044/tutu"
Repository = "https://github.com/Moxin1044/tutu"
Issues = "https://github.com/Moxin1044/tutu/issues"
Changelog = "https://github.com/Moxin1044/tutu/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["tutu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
