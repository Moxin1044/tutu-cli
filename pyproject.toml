[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutu-cli"
version = "0.3.0"
description = "tutu — 多源漏洞与威胁情报聚合搜索 CLI，含受影响版本判定与资产攻击面梳理"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tutu contributors" }]
keywords = ["vulnerability", "threat-intelligence", "cve", "nvd", "kev", "ransomware", "osint", "attack-surface", "subdomain", "recon", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "twine>=5"]

[project.scripts]
tutu = "tutu.cli:main"

[project.urls]
Homepage = "https://github.com/Moxin1044/tutu-cli"
Repository = "https://github.com/Moxin1044/tutu-cli"
Issues = "https://github.com/Moxin1044/tutu-cli/issues"
Changelog = "https://github.com/Moxin1044/tutu-cli/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["tutu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
